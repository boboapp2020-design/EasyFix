<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Fix — คอนโซล HR</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--brand:#0ea5a4;--brand-d:#0f766e;--brand-l:#e6fffb;--ink:#0f172a;--muted:#64748b;
    --line:#e2e8f0;--bg:#f1f5f9;--ok:#16a34a;--warn:#f59e0b;--wait:#94a3b8;--danger:#dc2626;
    font-family:"Segoe UI","Sarabun",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:18px 22px;position:sticky;top:0;z-index:10}
  header h1{font-size:20px} header .sub{opacity:.85;font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filt{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat .c{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
  .stat .c b{font-size:28px;display:block} .stat .c small{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .tk{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
  .tk .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .tk .id{font-size:12px;color:var(--muted);font-weight:700}
  .pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
  .st-wait{background:#f1f5f9;color:var(--wait)}.st-prog{background:#fef3c7;color:var(--warn)}.st-done{background:#dcfce7;color:var(--ok)}
  .ub{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .ub-n{background:#dcfce7;color:var(--ok)}.ub-u{background:#fef3c7;color:var(--warn)}.ub-e{background:#fee2e2;color:var(--danger)}
  .tk.emg{border:2px solid var(--danger)}
  .tk h3{font-size:16px;margin:2px 0} .tk .meta{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0}
  .tk .detail{background:var(--bg);border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
  label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:8px 0 4px}
  input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{width:100%;border:none;border-radius:10px;padding:11px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit}
  .btn:active{transform:scale(.99)}
  .login{max-width:360px;margin:60px auto;background:#fff;padding:26px;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.1)}
  .photos img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:6px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:.3s}
  .toast.show{opacity:1}
  .demo{position:fixed;top:6px;right:6px;background:#fde68a;color:#92400e;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1>🛠️ Easy Fix · คอนโซล HR</h1><div class="sub">จัดการคิวงานแจ้งซ่อมบ้านพักพนักงาน</div></div></header>

<div id="login" class="login">
  <h2 style="margin-bottom:14px">เข้าสู่ระบบ HR</h2>
  <label>รหัสผ่าน HR</label>
  <input id="hrkey" type="password" placeholder="HR key">
  <button class="btn" onclick="hrLogin()">เข้าสู่ระบบ</button>
  <p id="lerr" style="color:var(--danger);font-size:13px;margin-top:10px;display:none"></p>
</div>

<div id="main" class="wrap" style="display:none">
  <div class="stat" id="stat"></div>
  <div class="bar">
    <div class="filt" id="filt"></div>
    <button class="chip" onclick="load()" style="margin-left:auto">🔄 รีเฟรช</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>
<div class="demo" id="demo" style="display:none">DEMO</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbx3lJtRGasyqF_TbY3y841GYj0xkOIHh_Gb9-WcThXnKhY0BEJa2O_x3_LZiTUwkhmcXg/exec"; const DEMO=!API_URL;
let HRKEY=""; let FILTER='ทั้งหมด';
const STATUSES=['ทั้งหมด','รอดำเนินการ','กำลังดำเนินการ','ดำเนินการแล้วเสร็จ'];
const $=id=>document.getElementById(id);

let DEMO_TK=[
  {ticketId:'TK-20260821-003',createdAt:'2026-08-21 08:40',name:'นาย เริ่มพงษ์ คลังภูเขียว',dept:'ด้านอ้อย',zone:'บ้านพักโนนสัน',room:'NSA3',phone:'0812345678',category:'ประปา',urgency:'เร่งด่วน',detail:'ก๊อกน้ำห้องครัวรั่วซึม',photos:'',status:'กำลังดำเนินการ',appointDate:'2026-08-22',appointTime:'13:30',hrNote:'สั่งอะไหล่แล้ว',round:'รอบ 2'},
  {ticketId:'TK-20260821-002',createdAt:'2026-08-21 08:05',name:'นาย อภิโชติ ศรัทธาพิทักษ์',dept:'ผู้จัดการไร่ชุมชน 2',zone:'บ้านพักโนนสัน',room:'NSA2',phone:'0898765432',category:'เครื่องปรับอากาศ',urgency:'ฉุกเฉิน',detail:'แอร์มีน้ำหยด+กลิ่นไหม้ กลัวไฟช็อต',photos:'',status:'รอดำเนินการ',appointDate:'',appointTime:'',hrNote:'',round:'รอบ 2'},
  {ticketId:'TK-20260819-001',createdAt:'2026-08-19 09:12',name:'นาย อภิโชติ ศรัทธาพิทักษ์',dept:'ผู้จัดการไร่ชุมชน 2',zone:'บ้านพักโนนสัน',room:'NSA2',phone:'0898765432',category:'ไฟฟ้า',urgency:'ปกติ',detail:'หลอดไฟหน้าห้องเสีย',photos:'',status:'ดำเนินการแล้วเสร็จ',appointDate:'2026-08-20',appointTime:'10:00',hrNote:'เปลี่ยนหลอด LED',round:'รอบ 1',ratingScore:5}
];

async function api(action,p){
  if(DEMO) return demo(action,p);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},p))});
  return r.json();
}
function demo(action,p){ return new Promise(res=>setTimeout(()=>{
  if(action==='hrList'){ let t=DEMO_TK.slice(); if(p.filter&&p.filter!=='ทั้งหมด') t=t.filter(x=>x.status===p.filter); return res({ok:true,data:{tickets:t}}); }
  if(action==='hrUpdate'){ const t=DEMO_TK.find(x=>x.ticketId===p.ticketId);
    if(t){Object.assign(t,{status:p.status,appointDate:p.appointDate,appointTime:p.appointTime,hrNote:p.hrNote});} return res({ok:true,data:{ok:true}}); }
  res({ok:false});
},300)); }

function hrLogin(){
  HRKEY=$('hrkey').value.trim();
  if(DEMO && !HRKEY) HRKEY='demo';
  if(!HRKEY){ $('lerr').style.display='block'; $('lerr').textContent='กรุณากรอกรหัส'; return; }
  $('login').style.display='none'; $('main').style.display='block'; if(DEMO)$('demo').style.display='block';
  renderFilt(); load();
}
function renderFilt(){ $('filt').innerHTML=STATUSES.map(s=>`<div class="chip ${s===FILTER?'on':''}" onclick="setFilt('${s}')">${s}</div>`).join(''); }
function setFilt(s){ FILTER=s; renderFilt(); load(); }

async function load(){
  const r=await api('hrList',{hrKey:HRKEY,filter:FILTER});
  if(!r.ok){ toast(r.error||'โหลดไม่สำเร็จ'); return; }
  const all= DEMO? DEMO_TK : r.data.tickets;
  const c={wait:0,prog:0,done:0}; all.forEach(t=>{ if(t.status==='รอดำเนินการ')c.wait++; else if(t.status==='กำลังดำเนินการ')c.prog++; else c.done++; });
  $('stat').innerHTML=`
    <div class="c"><b>${all.length}</b><small>ทั้งหมด</small></div>
    <div class="c"><b style="color:var(--wait)">${c.wait}</b><small>⏳ รอดำเนินการ</small></div>
    <div class="c"><b style="color:var(--warn)">${c.prog}</b><small>🔧 กำลังดำเนินการ</small></div>
    <div class="c"><b style="color:var(--ok)">${c.done}</b><small>✅ เสร็จแล้ว</small></div>`;
  const list=r.data.tickets.slice().sort((a,b)=>{
    const ad=a.status==='ดำเนินการแล้วเสร็จ'?1:0, bd=b.status==='ดำเนินการแล้วเสร็จ'?1:0;
    if(ad!==bd) return ad-bd;                                    // ที่ยังไม่เสร็จขึ้นก่อน
    return (URANK[a.urgency]??2)-(URANK[b.urgency]??2);          // เร่งด่วนกว่าขึ้นก่อน
  });
  $('grid').innerHTML=list.map(card).join('') || '<p>ไม่มีรายการ</p>';
}
function pill(s){ const m={'รอดำเนินการ':'st-wait','กำลังดำเนินการ':'st-prog','ดำเนินการแล้วเสร็จ':'st-done'};
  return `<span class="pill ${m[s]||'st-wait'}">${s}</span>`; }
function ub(u){ const m={'ปกติ':'ub-n','เร่งด่วน':'ub-u','ฉุกเฉิน':'ub-e'},ic={'ปกติ':'🟢','เร่งด่วน':'🟡','ฉุกเฉิน':'🔴'};
  return u?`<span class="ub ${m[u]||'ub-n'}">${ic[u]||''} ${u}</span>`:''; }
const URANK={'ฉุกเฉิน':0,'เร่งด่วน':1,'ปกติ':2};
function card(t){ const opt=s=>['รอดำเนินการ','กำลังดำเนินการ','ดำเนินการแล้วเสร็จ'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join(''); return `
  <div class="tk ${t.urgency==='ฉุกเฉิน'&&t.status!=='ดำเนินการแล้วเสร็จ'?'emg':''}">
    <div class="top"><span class="id">${t.ticketId} · ${t.round||''}</span>${pill(t.status)}</div>
    <div style="margin:2px 0 6px">${ub(t.urgency)}</div>
    <h3>${t.category} — ห้อง ${t.room}</h3>
    <div class="meta">👤 ${t.name} · ${t.dept}<br>🏠 ${t.zone} · ☎️ ${t.phone||'-'}<br>🗓️ ${t.createdAt}</div>
    <div class="detail">${t.detail}</div>
    ${t.photos?`<div class="photos">${String(t.photos).split(',').filter(x=>x.trim()).map(u=>`<img src="${u.trim()}">`).join('')}</div>`:''}
    <label>สถานะงาน</label><select id="st-${t.ticketId}">${opt(t.status)}</select>
    <div class="two"><div><label>วันนัดซ่อม</label><input type="date" id="ad-${t.ticketId}" value="${t.appointDate||''}"></div>
      <div><label>เวลา</label><input type="time" id="at-${t.ticketId}" value="${t.appointTime||''}"></div></div>
    <label>หมายเหตุ / วิธีซ่อม / ระยะเวลา</label><textarea id="nt-${t.ticketId}" rows="2">${t.hrNote||''}</textarea>
    ${t.ratingScore?`<div style="margin-top:8px;color:var(--ok);font-weight:700">คะแนน: ${'⭐'.repeat(t.ratingScore)}</div>`:''}
    <button class="btn" onclick="save('${t.ticketId}')">💾 บันทึก & แจ้งพนักงาน</button>
  </div>`; }

async function save(id){
  const r=await api('hrUpdate',{hrKey:HRKEY,ticketId:id,
    status:$('st-'+id).value, appointDate:$('ad-'+id).value, appointTime:$('at-'+id).value, hrNote:$('nt-'+id).value});
  if(r.ok){ toast('✅ บันทึกแล้ว'+($('st-'+id).value==='ดำเนินการแล้วเสร็จ'?' · พนักงานจะเห็นสถานะในแอป':'')); load(); }
  else toast(r.error||'บันทึกไม่สำเร็จ');
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
</script>
</body>
</html>
